name: Foundation CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  verify:
    name: Typecheck, integration test, build and audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexusforge
          POSTGRES_PASSWORD: integration_test_only
          POSTGRES_DB: nexusforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusforge -d nexusforge_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://nexusforge:integration_test_only@localhost:5432/nexusforge_test?schema=public
      ACCESS_TOKEN_SECRET: ci_access_secret_only_for_integration_tests_12345
      REFRESH_TOKEN_SECRET: ci_refresh_secret_only_for_integration_tests_67890
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: test
      DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply migrations
        run: npm run db:migrate
      - name: Typecheck
        run: npm run typecheck
      - name: Integration tests
        run: npm test
      - name: Production builds
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
